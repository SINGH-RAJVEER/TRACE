# Protected-only traffic evaluation.
experiment = "qwen3.5-teacher-harness-v1"
suite_path = "data/traffic/suite.json"
output_dir = "outputs/traffic-benchmarks"
model = "Qwen/Qwen3.5-9B"
model_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
timeout_seconds = 120
max_in_flight = 32
window_seconds = 10

[generation]
max_output_tokens = 256
seed = 42
temperature = 0
enable_thinking = false

[targets.after]
backend = "teacher_api"
# Protected teacher endpoint.
base_url = "http://127.0.0.1:8003"
service_revision = "replace-with-harness-revision"
gateway_domain = "ag_news"
# api_key_env = "TEACHER_API_TOKEN"

# For credential-based policies, give each actor a separate test credential.
# [targets.after.actor_key_envs]
# u00 = "TRAFFIC_U00_TOKEN"
