base_model = "Qwen/Qwen2.5-0.5B"
base_revision = "main"
dataset_path = "data/processed/train.jsonl"
output_dir = "artifacts/qwen2.5-0.5b-distilled"
eos_token = "<|im_end|>"
max_length = 2048
epochs = 1.0
per_device_batch_size = 1
gradient_accumulation_steps = 16
learning_rate = 1e-4
warmup_ratio = 0.03
logging_steps = 10
save_steps = 100
eval_steps = 100
seed = 42
precision = "bf16"
qlora = true
gradient_checkpointing = true
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = "all-linear"
