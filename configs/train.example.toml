# Student: Qwen3.5-2B-Base (Apache 2.0). Revision pinned 2026-10-15; re-verify before a paper run.
# The checkpoint also holds a vision encoder and an MTP head; AutoModelForCausalLM loads only
# the 1.88B-parameter text model, so LoRA never touches them.
base_model = "Qwen/Qwen3.5-2B-Base"
base_revision = "b1485b2fa6dfa1287294f269f5fb618e03d52d7c"
dataset_path = "data/processed/train.jsonl"
# Add reviewed validation prompts, prepare with --split validation, then enable this path.
# validation_dataset_path = "data/processed/validation.jsonl"
output_dir = "artifacts/qwen3.5-2b-distilled"
# Matches the Qwen3.5 chat template; the base tokenizer default (<|endoftext|>) is wrong here.
eos_token = "<|im_end|>"
chat_template_kwargs = { enable_thinking = false }
max_length = 2048
epochs = 1.0
per_device_batch_size = 1
gradient_accumulation_steps = 16
learning_rate = 1e-4
warmup_ratio = 0.03
logging_steps = 10
save_steps = 100
eval_steps = 100
eval_strategy = "epoch"
select_best_checkpoint = true
save_total_limit = 2
seed = 42
precision = "bf16"
qlora = true
# TRL 1.15 uses the fused LM head for ordinary NLL without full vocabulary logits.
loss_type = "nll"
attn_implementation = "sdpa"
# "auto" uses paged AdamW for QLoRA on native Linux, which pages its state into system memory
# when the GPU runs short, and fused AdamW otherwise, including under WSL 2.
optimizer = "auto"
# "auto" trains without offloading; on a CUDA out-of-memory error it resumes from the last
# checkpoint with activations kept in system memory, and remembers that for later resumes.
activation_offloading = "auto"
gradient_checkpointing = true
# Saves attention outputs instead of recomputing them, at extra activation-memory cost.
selective_gradient_checkpointing = false
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = "all-linear"
