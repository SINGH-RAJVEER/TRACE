# Full run on the standard prompt corpus. See docs/prompt-corpus.md.
# Student: Qwen3.5-2B-Base (Apache 2.0). Revision pinned 2026-10-15; re-verify before a paper run.
# The checkpoint also holds a vision encoder and an MTP head; AutoModelForCausalLM loads only
# the 1.88B-parameter text model, so LoRA never touches them.
base_model = "Qwen/Qwen3.5-2B-Base"
base_revision = "b1485b2fa6dfa1287294f269f5fb618e03d52d7c"
dataset_path = "data/processed/train.jsonl"
validation_dataset_path = "data/processed/validation.jsonl"
output_dir = "artifacts/qwen3.5-2b-distilled-r128"
# Matches the Qwen3.5 chat template; the base tokenizer default (<|endoftext|>) is wrong here.
eos_token = "<|im_end|>"
chat_template_kwargs = { enable_thinking = false }
# Prompts are capped at 3,000 characters and teacher answers at 1,024 tokens.
max_length = 3072
epochs = 2.0
per_device_batch_size = 4
gradient_accumulation_steps = 8
learning_rate = 1e-4
warmup_ratio = 0.03
logging_steps = 20
save_steps = 500
eval_steps = 500
# The quick corpus runs fewer than 500 steps; use "epoch" there so a checkpoint is still selected.
eval_strategy = "steps"
select_best_checkpoint = true
save_total_limit = 3
seed = 42
precision = "bf16"
# Train LoRA on the BF16 base. A 4-bit base costs small models more accuracy than it saves
# memory, and the adapter would partly learn to correct quantization error. Set qlora = true
# only when BF16 does not fit, and then set load_in_4bit = true for both eval student slots.
qlora = false
# TRL 1.15 uses the fused LM head for ordinary NLL without full vocabulary logits.
loss_type = "nll"
attn_implementation = "sdpa"
# "auto" uses fused AdamW, or paged AdamW for QLoRA on native Linux, which pages its state
# into system memory when the GPU runs short.
optimizer = "auto"
# "auto" trains without offloading; on a CUDA out-of-memory error it resumes from the last
# checkpoint with activations kept in system memory, and remembers that for later resumes.
activation_offloading = "auto"
gradient_checkpointing = true
selective_gradient_checkpointing = false
# Rank 128 on every linear layer of the 24 text layers (18 linear-attention, 6 full-attention)
# trains 1,051,200 parameters per rank, about 135M in total, eight times the example config.
# The adapted text model stays near 2.0B parameters against the 9B teacher.
lora_rank = 128
lora_alpha = 256
lora_dropout = 0.05
target_modules = "all-linear"
