# Full run on the standard prompt corpus. See docs/prompt-corpus.md.
# Student: Qwen3-4B-Base (Apache 2.0). Revision pinned 2026-09-05; re-verify before a paper run.
base_model = "Qwen/Qwen3-4B-Base"
base_revision = "906bfd4b4dc7f14ee4320094d8b41684abff8539"
dataset_path = "data/processed/train.jsonl"
validation_dataset_path = "data/processed/validation.jsonl"
output_dir = "artifacts/qwen3-4b-distilled-r128"
# Matches the Qwen3 chat template; the tokenizer default (<|endoftext|>) is wrong for this family.
eos_token = "<|im_end|>"
chat_template_kwargs = { enable_thinking = false }
# Prompts are capped at 3,000 characters and teacher answers at 1,024 tokens.
max_length = 3072
epochs = 2.0
per_device_batch_size = 4
gradient_accumulation_steps = 8
learning_rate = 1e-4
warmup_ratio = 0.03
logging_steps = 20
save_steps = 500
eval_steps = 500
# The quick corpus runs fewer than 500 steps; use "epoch" there so a checkpoint is still selected.
eval_strategy = "steps"
select_best_checkpoint = true
save_total_limit = 3
seed = 42
precision = "bf16"
qlora = true
# TRL 1.15 uses the fused LM head for ordinary NLL without full vocabulary logits.
loss_type = "nll"
attn_implementation = "sdpa"
activation_offloading = false
gradient_checkpointing = true
selective_gradient_checkpointing = false
# Rank 128 on every linear layer trains 2,064,384 parameters per rank (36 layers, 57,344
# each), about 264M in total, eight times the example config. The adapted student stays
# near 4.3B parameters against the 14.8B teacher.
lora_rank = 128
lora_alpha = 256
lora_dropout = 0.05
target_modules = "all-linear"
