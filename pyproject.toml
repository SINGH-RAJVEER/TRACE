[project]
name = "evaluating-an-account-level-harness-against-multi-domain-model-distillation"
version = "0.1.0"
description = "Evaluating an account-level harness against multi-domain model distillation"
requires-python = ">=3.14,<3.15"
dependencies = [
	"dashboard-api",
	"distillation-core",
	"extraction-harness",
	"harness-api",
	"teacher-api"
]

[project.optional-dependencies]
coding = [
	"distillation-core[coding]"
]
eval = [
	"distillation-core[eval]"
]
embed = [
	"extraction-harness[embed]"
]
train = [
	"distillation-core[train]"
]

[tool.uv]
package = false

[tool.uv.sources]
dashboard-api = { workspace = true }
distillation-core = { workspace = true }
extraction-harness = { workspace = true }
harness-api = { workspace = true }
teacher-api = { workspace = true }
coding-task = { workspace = true }
trace-watermark = { workspace = true }

[tool.uv.workspace]
members = [
	"packages/coding",
	"apps/dashboard-api",
	"apps/harness-api",
	"apps/teacher-api",
	"packages/distillation",
	"packages/harness",
	"packages/watermark"
]

[dependency-groups]
dev = [
	"mypy>=1.17.1,<2",
	"packaging<26.3",
	"pytest>=8.4.1,<9",
	"pytest-asyncio>=1.1.0",
	"ruff>=0.12.9"
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/watermark/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
# Frozen study outputs include historical scripts; preserve them byte-for-byte.
extend-exclude = ["readings", "archives"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
exclude = ["artifacts", "archives"]

[[tool.mypy.overrides]]
module = ["datasets.*", "huggingface_hub.*", "peft.*", "torch.*", "transformers.*", "trl.*"]
ignore_missing_imports = true
follow_imports = "skip"
