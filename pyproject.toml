[project]
name = "distillation-lab"
version = "0.1.0"
description = "Hosted-teacher sequence distillation research environment"
requires-python = ">=3.14,<3.15"
dependencies = [
	"distillation-core",
	"extraction-harness",
	"harness-api",
	"teacher-api"
]

[project.optional-dependencies]
coding = [
	"distillation-core[coding]"
]
train = [
	"distillation-core[train]"
]
eval = [
	"distillation-core[eval]"
]
embed = [
	"extraction-harness[embed]"
]

[tool.uv]
package = false

[tool.uv.sources]
distillation-core = { workspace = true }
extraction-harness = { workspace = true }
harness-api = { workspace = true }
teacher-api = { workspace = true }
coding-task = { workspace = true }

[tool.uv.workspace]
members = [
	"packages/coding",
	"apps/harness-api",
	"apps/teacher-api",
	"packages/distillation",
	"packages/harness"
]

[dependency-groups]
dev = [
	"mypy>=1.17.1,<2",
	"packaging<26.3",
	"pytest>=8.4.1,<9",
	"pytest-asyncio>=1.1.0",
	"ruff>=0.12.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
# The launcher bootstrap runs on any system Python before the workspace environment exists.
per-file-target-version = { "scripts/*.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
exclude = ["artifacts", "outputs"]

[[tool.mypy.overrides]]
module = ["accelerate.*", "datasets.*", "huggingface_hub.*", "peft.*", "safetensors.*", "tokenizers.*", "torch.*", "transformers.*", "trl.*"]
ignore_missing_imports = true
follow_imports = "skip"
