[project]
name = "harness-api"
version = "0.1.0"
description = "Protected teacher API: the extraction harness in front of the teacher inference API"
requires-python = ">=3.14,<3.15"
dependencies = [
	"distillation-core",
	"extraction-harness",
	"fastapi>=0.116.1",
	"pydantic-settings>=2.10.1",
	"uvicorn[standard]>=0.35.0"
]

[project.scripts]
harness-api = "harness_api.__main__:main"

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_api"]

[tool.uv.sources]
distillation-core = { workspace = true }
extraction-harness = { workspace = true }
