[project]
name = "distillation-core"
version = "0.1.0"
description = "Collection and student training tools for sequence-level distillation"
requires-python = ">=3.14,<3.15"
dependencies = [
	"coding-task",
	"anyio>=4.9,<4.12",
	"httpx>=0.28.1",
	# Model downloads with progress before vLLM or training starts.
	"huggingface-hub>=0.34.0",
	"pydantic>=2.11.7",
	"rich>=13.7",
	"typer>=0.16.0"
]

[project.optional-dependencies]
eval = [
	"datasets>=4.0.0",
	"huggingface-hub>=0.34.0"
]
train = [
	"accelerate>=1.15.0,<2",
	"bitsandbytes>=0.47.0; platform_system == 'Linux'",
	"datasets>=4.0.0",
	# Triton kernels for the Qwen3.5 linear-attention layers; transformers otherwise falls back to
	# a slower PyTorch path. causal-conv1d is left out because it builds with nvcc.
	"flash-linear-attention>=0.5.2,<0.6; platform_system == 'Linux'",
	"peft>=0.21.2,<1",
	"torch>=2.14.1,<3",
	"transformers>=5.19.0,<6",
	"trl>=1.15.0,<2"
]

[project.scripts]
distill = "distillation.cli:app"

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.uv.sources]
coding-task = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/distillation"]
