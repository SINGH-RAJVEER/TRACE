[project]
name = "distillation-core"
version = "0.1.0"
description = "Campaign generation and measurement for extraction defenses"
requires-python = ">=3.14,<3.15"
dependencies = [
	"coding-task",
	"anyio>=4.9,<4.12",
	"httpx>=0.28.1",
	# Model downloads with progress before vLLM or training starts.
	"huggingface-hub>=0.34.0",
	"pydantic>=2.11.7",
	"rich>=13.7",
	"typer>=0.16.0",
	"trace-watermark"
]

[project.optional-dependencies]
coding = ["coding-task"]
eval = [
	"datasets>=4.0.0",
	"huggingface-hub>=0.34.0"
]
# Student training and base scoring for the checkpoint and baseline-gate workflows.
train = [
	"datasets>=4.0.0",
	"peft>=0.21.2",
	"torch>=2.14.1,<3",
	"transformers>=5.19.0,<6",
	"trl>=1.17.1"
]

[project.scripts]
distill = "distillation.cli:app"

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.uv.sources]
coding-task = { workspace = true }
trace-watermark = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/distillation"]
