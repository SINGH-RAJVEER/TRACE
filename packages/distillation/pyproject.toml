[project]
name = "distillation-core"
version = "0.1.0"
description = "Collection and student training tools for sequence-level distillation"
requires-python = ">=3.14,<3.15"
dependencies = [
	"anyio>=4.9,<4.12",
	"httpx>=0.28.1",
	"pydantic>=2.11.7",
	"typer>=0.16.0"
]

[project.optional-dependencies]
train = [
	"accelerate>=1.15.0,<2",
	"bitsandbytes>=0.47.0; platform_system == 'Linux'",
	"datasets>=4.0.0",
	"peft>=0.21.2,<1",
	"torch>=2.14.1,<3",
	"transformers>=5.19.0,<6",
	"trl>=1.15.0,<2"
]

[project.scripts]
distill = "distillation.cli:app"

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillation"]
