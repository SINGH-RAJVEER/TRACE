[project]
name = "coding-task"
version = "0.1.0"
description = "Sandbox and corpus preparation for coding distillation"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2"]

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding"]
