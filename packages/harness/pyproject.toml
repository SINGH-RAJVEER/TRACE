[project]
name = "extraction-harness"
version = "0.1.0"
description = "Session-level extraction detection and graduated access control for a model API"
requires-python = ">=3.14,<3.15"
dependencies = [
	"numpy>=2.3",
	"pydantic>=2.11.7",
	"typer>=0.16.0"
]

[project.optional-dependencies]
# The BGE query encoder. Tests and replays with precomputed embeddings do not need it.
embed = [
	"torch>=2.14.1,<3",
	"transformers>=5.19.0,<6"
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling", "packaging<26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
