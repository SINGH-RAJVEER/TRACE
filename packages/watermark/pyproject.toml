[project]
name = "trace-watermark"
version = "0.1.0"
description = "TRACE keyed KGW watermark generation, vLLM integration and detection"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.1,<3"]

[project.scripts]
trace-watermark = "trace_watermark.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4.1,<9", "ruff>=0.12.9"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"
